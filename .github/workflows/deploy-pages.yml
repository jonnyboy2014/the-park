name: Deploy THE PARK to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'games/the-park/100-doors/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: games/the-park/100-doors
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
